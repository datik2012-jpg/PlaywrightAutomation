<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Courts</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 56px 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.15), transparent 30%),
          radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.12), transparent 32%),
          #f4f7fb;
      }

      main { width: min(100%, 900px); margin: 0 auto; }
      header { margin-bottom: 30px; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); }
      .intro { margin: 0; color: #667085; }

      .courts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      article {
        padding: 28px;
        border: 1px solid #e3e8f1;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 45px rgba(31, 47, 74, 0.1);
      }

      h2 { margin: 0 0 18px; font-size: 1.4rem; }
      .details { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
      .available { color: #067647; font-weight: 700; }
      time { color: #475467; font-weight: 650; }

      button {
        width: 100%;
        padding: 13px 18px;
        border: 0;
        border-radius: 9px;
        background: #315bd6;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { background: #2449b8; }
      button:focus-visible { outline: 3px solid rgba(49, 91, 214, 0.35); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Available courts</h1>
        <p class="intro">Choose a court and reserve your 18:00 session.</p>
      </header>

      <section class="courts" aria-label="Court availability">
        <article aria-labelledby="court-a-name">
          <h2 id="court-a-name">Court A</h2>
          <div class="details">
            <span class="available">Available</span>
            <time datetime="18:00">18:00</time>
          </div>
          <button id="book-court-a" type="button">Book</button>
        </article>

        <article aria-labelledby="court-b-name">
          <h2 id="court-b-name">Court B</h2>
          <div class="details">
            <span class="available">Available</span>
            <time datetime="18:00">18:00</time>
          </div>
          <button id="book-court-b" type="button">Book</button>
        </article>
      </section>
    </main>
  </body>
</html>
