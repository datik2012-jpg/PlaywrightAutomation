<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back | Demo Login</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.15), transparent 30%),
          radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.12), transparent 32%),
          #f4f7fb;
      }

      main {
        width: min(100%, 420px);
        padding: 40px;
        border: 1px solid #e3e8f1;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 60px rgba(31, 47, 74, 0.12);
      }

      h1 { margin: 0 0 8px; font-size: 2rem; }
      .intro { margin: 0 0 30px; color: #667085; }
      .field { margin-bottom: 20px; }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd3df;
        border-radius: 9px;
        font: inherit;
        outline: none;
        transition: border-color 150ms, box-shadow 150ms;
      }

      input:focus {
        border-color: #315bd6;
        box-shadow: 0 0 0 3px rgba(49, 91, 214, 0.14);
      }

      button {
        width: 100%;
        padding: 13px 18px;
        border: 0;
        border-radius: 9px;
        background: #315bd6;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { background: #2449b8; }
      button:focus-visible { outline: 3px solid rgba(49, 91, 214, 0.35); outline-offset: 3px; }

      #status {
        min-height: 24px;
        margin: 18px 0 0;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .success { color: #067647; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome back</h1>
      <p class="intro">Enter your details to access your account.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />
        </div>

        <button id="login-button" type="submit">Log In</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.querySelector('#login-form');
      const status = document.querySelector('#status');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        status.className = '';

        if (!form.checkValidity()) {
          status.textContent = 'Enter a valid email and a password of at least 6 characters.';
          status.classList.add('error');
          return;
        }

        window.location.href = '/courts.html';
      });
    </script>
  </body>
</html>
